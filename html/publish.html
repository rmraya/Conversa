<!DOCTYPE html>
<html lang="en">

<head>
    <title>Publish DITA Map</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../css/dark.css">
</head>

<body>
    <table>
        <tr>
            <td class="noWrap middle"><label for="ditamap">DITA Map</label></td>
            <td class="fill_width middle"><input id="ditamap" type="text" class="fill_width"></td>
            <td class="middle"><button id="browseDITA">Browse...</button></td>
        </tr>
        <tr>
            <td class="noWrap middle"><label for="output">Output Folder</label></td>
            <td class="fill_width middle"><input id="output" type="text" class="fill_width"></td>
            <td class="middle"><button id="browseOutput">Browse...</button></td>
        </tr>
        <tr>
            <td class="noWrap middle"><label for="ditaval">DITAVAL File</label></td>
            <td class="fill_width middle"><input id="ditaval" type="text" class="fill_width"></td>
            <td class="middle"><button id="browseDITAVAL">Browse...</button></td>
        </tr>
    </table>

    <h3 style="padding: 0px 8px; margin: 0px;">Output Formats</h3>
    <div class="paddedArea">
        <table class="bordered fill_width">
            <tr>
                <td><input id="pdf" type="checkbox" class="middle"><label for="pdf">PDF</label></td>
                <td><input id="eclipse" type="checkbox" class="middle"><label for="eclipse">Eclipse Help</label></td>
                <td><input id="epub2" type="checkbox" class="middle"><label for="epub2">EPUB 2</label></td>
                <td><input id="rtf" type="checkbox" class="middle"><label for="rtf" class="disabled">RTF</label></td>
            </tr>
            <tr>
                <td><input id="html" type="checkbox" class="middle"><label for="html">HTML</label></td>
                <td><input id="webhelp" type="checkbox" class="middle"><label for="webhelp">Web Help</label></td>
                <td><input id="epub3" type="checkbox" class="middle"><label for="epub3">EPUB 3</label></td>
                <td><input id="docx" type="checkbox" class="middle"><label for="docx" class="disabled">DOCX</label></td>
            </tr>
            <tr>
                <td><input id="xsl-fo" type="checkbox" class="middle"><label for="xsl-fo">XSL-FO</label></td>
                <td><input id="webhelp5" type="checkbox" class="middle"><label for="webhelp5">Web Help 5</label></td>
                <td><input id="htmlhelp" type="checkbox" class="middle"><label for="htmlhelp" class="disabled">HTML Help</label></td>
                <td><input id="odt" type="checkbox" class="middle"><label for="odt" class="disabled">ODT</label></td>
            </tr>
            <tr>
                <td><input id="postscript" type="checkbox" class="middle"><label for="postscript">PostScript</label>
                </td>
            </tr>
        </table>
    </div>

    <table>
        <tr>
            <td><input type="checkbox" id="open" class="middle"><label for="open">Open Publications Using Default Viewers</label></td>
        </tr>
        <tr>
            <td><input type="checkbox" id="log" class="middle"><label for="log">Show Log On Success</label></td>
        </tr>

    </table>

    <div class="paddedArea">
        <table class="fill_width">
            <tr>
                <td><input type="textarea" id="progress" style="height: 120px;" class="fill_width"></td>
            </tr>
        </table>
    </div>

    <div class="buttonArea">
        <button id="cancel">Cancel</button>
        <button id="publish">Publish</button>
    </div>
</body>

</html>
